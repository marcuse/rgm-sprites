<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RGM Sprite Overlay PoC</title>

    <style>
      body {
        background: black;
        color: white;
      }

      canvas {
        border: 2px solid blue;
      }
    </style>
  </head>

  <body>
    <main>
      <canvas id="display" width="800" height="600"></canvas>
    </main>
    <p>Active: <output id="numSprites">0</output></p>
  </body>

  <script>
    class AgonyOwl {
      x = -32;
      y = 0;
      f = 0;
      frames = [
        [0, 0, 32, 86],
        [32, 0, 32, 86],
        [64, 0, 32, 86],
        [96, 0, 32, 86],
        [128, 0, 32, 86],
        [160, 0, 32, 86],
        [192, 0, 32, 86],
        [224, 0, 32, 86],
        [0, 86, 32, 86],
        [32, 86, 32, 86],
        [64, 86, 32, 86],
        [96, 86, 32, 86],
        [128, 86, 32, 86],
        [160, 86, 32, 86],
        [192, 86, 32, 86],
      ];

      constructor(ctx, y) {
        this.ctx = ctx;

        this.sheet = new Image();
        this.sheet.src = "owl.png";

        this.y = y;
        this.dx = 1 + Math.random() * 2;
        this.freq = 5 + Math.random() * 10;
        this.amp = Math.random() * 50;
        this.count = 0;
      }

      tick = function () {
        this.count++;
        const offset = Math.sin(this.count / this.freq) * this.amp;

        const frame = this.frames[this.f];
        this.ctx.drawImage(
          this.sheet,
          frame[0],
          frame[1],
          frame[2],
          frame[3],
          this.x,
          this.y + offset,
          frame[2],
          frame[3]
        );

        this.f = (this.f + 1) % this.frames.length;
        this.x += this.dx;

        return this.x < 833;
      };
    }

    let sprites = [];

    function init() {
      const display = document.getElementById("display");
      const ctx = display.getContext("2d");

      display.addEventListener("click", (e) => {
        const s = new AgonyOwl(ctx, e.clientY - 44);
        sprites.push(s);
      });

      setInterval(tick, 32);
    }

    function tick() {
      const display = document.getElementById("display");
      const ctx = display.getContext("2d");
      ctx.clearRect(0, 0, 800, 600);

      const nextSprites = [];
      sprites.forEach((s) => {
        if (s.tick()) nextSprites.push(s);
      });
      sprites = nextSprites;
      document.getElementById("numSprites").innerText = sprites.length;
    }

    init();
  </script>
</html>
